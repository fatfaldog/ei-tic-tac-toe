<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Крестики-нолики</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16.png">
<link rel="icon" type="image/x-icon" href="assets/img/favicon.ico">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="scene">

  <!-- Главное окно: клиентская область 417x418 (TFORM1), фон — main-bg.jpg -->
  <div id="game-window" class="window">
    <div class="menubar">
      <div class="menu-item" id="menu-game">
        Игра
        <div class="dropdown" id="menu-game-dropdown">
          <button class="dd-item" tabindex="-1" id="mi-new-game">Новая игра</button>
          <button class="dd-item" tabindex="-1" id="mi-settings">Настройки</button>
          <div class="dd-sep"></div>
          <button class="dd-item" tabindex="-1" id="mi-exit">Выход</button>
        </div>
      </div>
      <div class="menu-item" id="mi-about">Об авторе</div>
    </div>

    <!-- Игровая область: клиентская область TFORM1 417x418 -->
    <div class="game-area">
      <!-- Поле 3x3: клетки 97x97 по координатам TImage (набор A) из layout.json,
           создаётся скриптом в #board -->
      <div id="board"></div>

      <!-- Оверлей результата партии (design.md D8) -->
      <div id="result-overlay" class="overlay" hidden>
        <div class="panel">
          <div id="result-text" class="panel-text"></div>
          <button id="result-new-game" tabindex="-1" class="stone-btn">Новая игра</button>
        </div>
      </div>

      <!-- Прощальный экран пункта «Выход» (design.md D10) -->
      <div id="farewell" class="overlay" hidden>
        <div class="panel">
          <div class="panel-text">Игра завершена.<br>Теперь можно закрыть вкладку.</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Окно «Настройки» (change redesign-settings-window): диалог в стиле ПЗ —
       плита-заголовок, рамка-список с фоном-существом, плиты OK/X -->
  <div id="settings-modal" class="modal-wrap" hidden>
    <div class="modal settings" role="dialog" aria-label="Настройки">
      <div class="settings-title">Настройки</div>

      <div class="settings-frame easy" id="settings-frame">
        <div class="settings-row" id="set-row-level" data-row="level">
          <span class="set-name">Уровень сложности</span>
          <span class="set-value" id="set-val-level">Легкий</span>
        </div>
        <div class="settings-row" id="set-row-first" data-row="first">
          <span class="set-name">Кто ходит первым</span>
          <span class="set-value" id="set-val-first">Я</span>
        </div>
        <div class="settings-row" id="set-row-layout" data-row="digitLayout">
          <span class="set-name">Раскладка 1-9</span>
          <span class="set-value" id="set-val-layout">Читающая</span>
        </div>
      </div>

      <div class="settings-buttons">
        <button class="plate-btn" tabindex="-1" id="set-ok" aria-label="Применить и закрыть">OK</button>
        <button class="plate-btn" tabindex="-1" id="set-cancel" aria-label="Закрыть без применения">X</button>
      </div>
    </div>
  </div>

    <!-- Окно «Об авторе» (change redesign-about-window): структурно как «Настройки» —
       плита-заголовок (срез с references/about.png), рамка с фоном-«крысом»
       (about-bg.jpg) и текстом, внизу одна плита-галочка -->
  <div id="about-modal" class="modal-wrap" hidden>
    <div class="modal about" role="dialog" aria-label="Об авторе">
      <div class="about-title">Об авторе</div>

      <div class="about-frame">
        <div class="about-col">
          <div class="about-group">
            <div class="about-role">Разработка</div>
            <div class="about-name">fatfaldog</div>
          </div>
          <div class="about-group">
            <div class="about-role">Тестирование</div>
            <div class="about-name">PPyatachok</div>
          </div>
        </div>
        <div class="about-col about-col-right">
          <div class="about-group">
            <div class="about-role">Особая благодарность</div>
            <div class="about-name">ksaont</div>
            <div class="about-name">Morgens</div>
            <div class="about-name">Проекту «<a class="about-link" href="https://allods.gipat.ru/" target="_blank" rel="noopener">Вселенная Аллодов</a>»</div>
          </div>
        </div>
      </div>

      <div class="about-buttons">
        <button class="plate-btn" tabindex="-1" id="about-ok" aria-label="Закрыть окно">OK</button>
      </div>
    </div>
  </div>

</div>
<script src="js/engine.js"></script>
<script src="js/ai.js"></script>
<script src="js/ui.js"></script>
<script src="js/input.js"></script>
<script src="js/main.js"></script>
</body>
</html>
